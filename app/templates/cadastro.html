<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkly — Cadastro</title>
  <link rel="stylesheet" href="/static/sparkly.css">
  <link rel="stylesheet" href="/static/css/cadastro.css">
</head>
<body>
<div class="wrap">
  <div class="owl">🐝</div>
  <div class="logo-big">Sparkly</div>
  <div class="tagline">Crie sua conta grátis!</div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div class="alert alert-danger" id="erroMsg" style="display:none;margin-bottom:14px;"></div>
  <div class="alert alert-success" id="sucessoMsg" style="display:none;margin-bottom:14px;"></div>

  <div class="form-group">
    <label>Nome Completo</label>
    <input type="text" class="input" id="nome" placeholder="Seu nome" oninput="atualizarBarra()">
  </div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" class="input" id="email" placeholder="seu@email.com" oninput="atualizarBarra()">
  </div>
  <div class="form-group">
    <label>Usuário</label>
    <input type="text" class="input" id="usuarioNovo" placeholder="seu_usuario" oninput="atualizarBarra()">
  </div>
  <div class="form-group">
    <label>Senha</label>
    <input type="password" class="input" id="senhaNova" placeholder="Mínimo 3 caracteres" oninput="atualizarBarra()">
  </div>
  <div class="form-group">
    <label>Confirmar Senha</label>
    <input type="password" class="input" id="senhaConfirmar" placeholder="Repita a senha" oninput="atualizarBarra()">
  </div>

  <button class="btn btn-primary btn-full btn-lg mt-2" onclick="realizarCadastro()">Criar conta</button>
  <p class="text-center text-muted mt-2" style="font-size:0.82rem;font-weight:600;">
    Já tem conta? <a href="/login">Fazer login</a>
  </p>
</div>
  <script src="/static/js/cadastro.js"></script>
</body>
</html>
