<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkly — Professor</title>
  <link rel="stylesheet" href="/static/sparkly.css">
  <link rel="stylesheet" href="/static/css/professor-dashboard.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">Sparkly<span class="dot">.</span></div>
  <div class="d-flex align-center gap-2">
    <div class="d-flex align-center gap-1"
      style="background:var(--green-soft);border:2px solid var(--green);border-radius:var(--radius-sm);padding:6px 12px;">
      <div id="professorAvatar"
        style="width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.82rem;">P</div>
      <span id="professorNome" style="font-size:.82rem;font-weight:800;color:var(--green);">Professor</span>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="sair()">Sair</button>
  </div>
</nav>

<div class="container">
  <nav class="sidebar">
    <div class="nav-label" style="margin-bottom:10px;">Menu</div>
    <button class="nav-item active" onclick="showSection('turmas')" id="nav-turmas">
      <span class="icon">📚</span> Turmas
    </button>
    <button class="nav-item" onclick="showSection('questoes')" id="nav-questoes">
      <span class="icon">❓</span> Questões
    </button>
  </nav>

  <main>

    <!-- TURMAS -->
    <div class="section active" id="sec-turmas">
      <div class="mb-3">
        <div class="page-title">Minhas Turmas 📚</div>
        <div class="page-sub">Turmas vinculadas à sua conta</div>
      </div>

      <div class="stats-row" id="statsRow">
        <div class="stat-card c1"><div class="stat-icon">📚</div><div class="stat-value" id="stat-turmas">—</div><div class="stat-label">Turmas</div></div>
        <div class="stat-card c2"><div class="stat-icon"></div><div class="stat-value" id="stat-licoes">—</div><div class="stat-label">Lições</div></div>
        <div class="stat-card c3"><div class="stat-icon">👥</div><div class="stat-value" id="stat-alunos">—</div><div class="stat-label">Alunos</div></div>
      </div>

      <div class="turmas-grid" id="turmasGrid">
        <div class="loading"><div class="spinner" style="margin:0 auto 10px;"></div>Carregando turmas...</div>
      </div>
      <div id="turmaDetalhe" style="display:none;"></div>
    </div>

    <!-- QUESTÕES -->
    <div class="section" id="sec-questoes">
      <div class="questoes-toolbar">
        <div>
          <div class="page-title">Banco de Questões </div>
          <div class="page-sub">Gerencie as questões do sistema</div>
        </div>
        <div class="d-flex gap-1">
          <button class="btn btn-outline btn-sm" onclick="sincronizarInstancias()" title="Tornar questões visíveis para alunos"> Levar aos alunos! </button>
          <button class="btn btn-primary btn-sm" onclick="abrirModalNovaQuestao()">+ Nova Questão</button>
        </div>
      </div>
      <div class="questoes-list" id="questoesList">
        <div class="loading"><div class="spinner" style="margin:0 auto 10px;"></div>Carregando questões...</div>
      </div>
    </div>

  </main>
</div>

<!-- MODAL: NOVA QUESTÃO -->
<div class="modal-overlay" id="modalQuestao">
  <div class="modal">
    <div class="modal-title">Nova Questão </div>
    <div class="form-group">
      <label class="form-label">Nome / Título</label>
      <input type="text" class="form-input" id="q-nome" placeholder="Ex: Lei de Newton — Força e Massa">
    </div>
    <div class="form-group">
      <label class="form-label">Tipo</label>
      <select class="form-select" id="q-tipo" onchange="tipoChanged()">
        <option value="multipla-escolha">Múltipla Escolha</option>
        <option value="multi-selecao">Múltipla Seleção</option>
        <option value="entrada-texto">Dissertativa / Texto</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Enunciado</label>
      <textarea class="form-textarea" id="q-enunciado" placeholder="Digite o enunciado..."></textarea>
    </div>
    <div id="bloco-alternativas" class="form-group">
      <label class="form-label">Alternativas <span id="hint-gabarito" style="color:var(--green);font-size:.65rem;"> — marque a correta</span></label>
      <div class="alternativas-container" id="alternativas-container"></div>
      <button class="btn-add-alt" onclick="adicionarAlternativa()">+ Adicionar alternativa</button>
    </div>
    <div id="bloco-gabarito" class="form-group" style="display:none;">
      <label class="form-label">Resposta esperada</label>
      <textarea class="form-textarea" id="q-gabarito" placeholder="Digite a resposta..." style="min-height:70px;"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarQuestao()"> Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: VER QUESTÃO -->
<div class="modal-overlay" id="modalVerQuestao">
  <div class="modal">
    <div class="modal-title" id="verQ-nome"></div>
    <div style="font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:14px;font-weight:800;" id="verQ-tipo"></div>
    <div class="conteudo-preview" id="verQ-conteudo"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharVerQuestao()">Fechar</button>
    </div>
  </div>
</div>

<!-- MODAL: EDITAR QUESTÃO -->
<div class="modal-overlay" id="modalEditarQuestao">
  <div class="modal">
    <div class="modal-title">Editar Questão </div>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label class="form-label">Nome / Título</label>
      <input type="text" class="form-input" id="edit-nome">
    </div>
    <div class="form-group">
      <label class="form-label">Tipo</label>
      <select class="form-select" id="edit-tipo" onchange="editTipoChanged()">
        <option value="multipla-escolha">Múltipla Escolha</option>
        <option value="multi-selecao">Múltipla Seleção</option>
        <option value="entrada-texto">Dissertativa / Texto</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Enunciado</label>
      <textarea class="form-textarea" id="edit-enunciado"></textarea>
    </div>
    <div id="edit-bloco-alternativas" class="form-group">
      <label class="form-label">Alternativas <span style="color:var(--green);font-size:.65rem;"> — marque a correta</span></label>
      <div class="alternativas-container" id="edit-alternativas-container"></div>
      <button class="btn-add-alt" onclick="editAdicionarAlternativa()">+ Adicionar alternativa</button>
    </div>
    <div id="edit-bloco-gabarito" class="form-group" style="display:none;">
      <label class="form-label">Resposta esperada</label>
      <textarea class="form-textarea" id="edit-gabarito" style="min-height:70px;"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharEditarQuestao()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarEdicao()"> Salvar Alterações</button>
    </div>
  </div>
</div>

<div id="toast"></div>
  <script src="/static/js/professor-dashboard.js"></script>
</body>
</html>
