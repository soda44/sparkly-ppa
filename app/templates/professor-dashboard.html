<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkly — Professor</title>
  <link rel="stylesheet" href="/static/sparkly.css">
  <style>
    body { display:flex; flex-direction:column; }
    .container { display:flex; flex:1; }

    /* Sidebar */
    nav.sidebar {
      width:220px; min-height:calc(100vh - 64px);
      background:var(--white); border-right:2px solid var(--border);
      padding:20px 12px; flex-shrink:0;
    }
    .nav-label { font-size:.65rem; font-weight:900; text-transform:uppercase; letter-spacing:2px; color:var(--muted); padding:0 8px; margin-bottom:6px; }
    .nav-item {
      display:flex; align-items:center; gap:10px; padding:10px 12px;
      border-radius:var(--radius-sm); cursor:pointer; font-size:.85rem; font-weight:800;
      color:var(--muted); transition:all .15s; border:none; background:none; width:100%; font-family:var(--font);
    }
    .nav-item:hover  { color:var(--text); background:var(--bg); }
    .nav-item.active { color:var(--green); background:var(--green-soft); }
    .nav-item .icon  { font-size:1.1rem; }

    main { flex:1; padding:28px; overflow-y:auto; background:var(--bg); }

    .section { display:none; }
    .section.active { display:block; }

    /* Stats */
    .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px; }
    .stat-card {
      background:var(--white); border:2px solid var(--border); border-bottom:4px solid;
      border-radius:var(--radius); padding:20px; text-align:center; box-shadow:var(--shadow);
    }
    .stat-card.c1 { border-bottom-color:var(--green); }
    .stat-card.c2 { border-bottom-color:var(--blue); }
    .stat-card.c3 { border-bottom-color:var(--yellow); }
    .stat-icon  { font-size:1.6rem; margin-bottom:6px; }
    .stat-value { font-size:2rem; font-weight:900; margin-bottom:2px; }
    .stat-card.c1 .stat-value { color:var(--green); }
    .stat-card.c2 .stat-value { color:var(--blue); }
    .stat-card.c3 .stat-value { color:var(--yellow-dk); }
    .stat-label { font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); }

    /* Turmas */
    .turmas-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; }
    .turma-card {
      background:var(--white); border:2px solid var(--border); border-bottom:4px solid var(--blue);
      border-radius:var(--radius); padding:22px; cursor:pointer; transition:all .15s; box-shadow:var(--shadow);
    }
    .turma-card:hover { border-color:var(--blue); transform:translateY(-2px); }
    .t-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
    .t-nome   { font-size:1rem; font-weight:900; }
    .t-sala   { font-size:.7rem; background:var(--blue-soft); color:#0080bb; border-radius:20px; padding:3px 10px; font-weight:800; }
    .t-stats  { display:flex; gap:24px; }
    .ts-num   { font-size:1.4rem; font-weight:900; color:var(--blue); }
    .ts-label { font-size:.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:800; }

    /* Detalhe */
    .back-btn {
      display:inline-flex; align-items:center; gap:8px; cursor:pointer;
      color:var(--muted); font-size:.82rem; font-weight:800; margin-bottom:20px;
      padding:8px 14px; border:2px solid var(--border); border-radius:var(--radius-sm);
      background:var(--white); font-family:var(--font); transition:all .15s;
    }
    .back-btn:hover { color:var(--green); border-color:var(--green); }
    .detalhe-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .panel {
      background:var(--white); border:2px solid var(--border);
      border-radius:var(--radius); padding:22px; box-shadow:var(--shadow);
    }
    .panel-title {
      font-size:.9rem; font-weight:900; margin-bottom:14px;
      padding-bottom:10px; border-bottom:2px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
    }

    /* Questões */
    .questoes-toolbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
    .questoes-list { display:flex; flex-direction:column; gap:10px; }
    .questao-item {
      background:var(--white); border:2px solid var(--border); border-radius:var(--radius);
      padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
      box-shadow:var(--shadow); transition:border-color .15s;
    }
    .questao-item:hover { border-color:var(--green); }
    .q-nome { font-size:.92rem; font-weight:900; margin-bottom:3px; }
    .q-tipo { font-size:.7rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:800; }
    .questao-actions { display:flex; gap:8px; flex-shrink:0; }
    .btn-icon {
      background:var(--white); border:2px solid var(--border); color:var(--muted);
      width:34px; height:34px; border-radius:var(--radius-sm); cursor:pointer;
      display:flex; align-items:center; justify-content:center; font-size:.85rem;
      transition:all .15s; flex-shrink:0;
    }
    .btn-icon.danger:hover { border-color:var(--red); color:var(--red); background:var(--red-soft); }
    .btn-icon.info:hover   { border-color:var(--blue); color:var(--blue); background:var(--blue-soft); }
    .btn-icon.edit:hover   { border-color:var(--yellow-dk); color:var(--yellow-dk); background:var(--yellow-soft); }

    /* Modal */
    .modal-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,.5); backdrop-filter:blur(4px);
      z-index:1000; align-items:center; justify-content:center; padding:20px;
    }
    .modal-overlay.active { display:flex; }
    .modal {
      background:var(--white); border:2px solid var(--border); border-radius:var(--radius-lg);
      padding:32px; width:100%; max-width:540px; max-height:90vh; overflow-y:auto;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
    }
    .modal-title { font-size:1.3rem; font-weight:900; margin-bottom:24px; }
    .form-label  { display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:7px; font-weight:800; }
    .form-input,.form-select,.form-textarea {
      width:100%; background:var(--bg); border:2px solid var(--border); border-radius:var(--radius-sm);
      color:var(--text); font-family:var(--font); font-size:.9rem; font-weight:600;
      padding:11px 14px; outline:none; transition:border-color .15s;
    }
    .form-input:focus,.form-select:focus,.form-textarea:focus { border-color:var(--green); }
    .form-textarea { min-height:100px; resize:vertical; }
    .form-select option { background:var(--white); }
    .modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; }
    .btn-cancel {
      background:var(--white); border:2px solid var(--border); color:var(--muted);
      padding:10px 20px; border-radius:var(--radius-sm); cursor:pointer;
      font-family:var(--font); font-size:.85rem; font-weight:800; transition:all .15s;
    }
    .btn-cancel:hover { border-color:var(--text); color:var(--text); }

    /* Alternativas */
    .alternativas-container { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
    .alternativa-row { display:flex; gap:8px; align-items:center; }
    .alternativa-row input[type=text] {
      flex:1; background:var(--white); border:2px solid var(--border); border-radius:var(--radius-sm);
      color:var(--text); font-family:var(--font); font-size:.85rem; font-weight:600;
      padding:9px 12px; outline:none;
    }
    .alternativa-row input[type=text]:focus { border-color:var(--green); }
    .alternativa-row input[type=radio] { accent-color:var(--green); width:16px; height:16px; }
    .alternativa-row label { font-size:.75rem; color:var(--muted); white-space:nowrap; font-weight:800; }
    .btn-add-alt {
      background:none; border:2px dashed var(--border); color:var(--muted);
      padding:8px; border-radius:var(--radius-sm); cursor:pointer; width:100%;
      font-size:.8rem; font-weight:800; font-family:var(--font); transition:all .15s; margin-top:4px;
    }
    .btn-add-alt:hover { border-color:var(--green); color:var(--green); }

    /* Preview */
    .conteudo-preview { background:var(--bg); border:2px solid var(--border); border-radius:var(--radius-sm); padding:14px; font-size:.82rem; line-height:1.6; }
    .conteudo-preview .alt { padding:7px 10px; border-radius:var(--radius-sm); margin-bottom:4px; border:2px solid var(--border); font-weight:600; }
    .conteudo-preview .alt.correta { background:var(--green-soft); border-color:var(--green); color:var(--green-dk); font-weight:800; }

    /* Misc */
    .empty-state { text-align:center; padding:40px; color:var(--muted); }
    .empty-state .em-icon { font-size:2.5rem; margin-bottom:10px; }
    .empty-state .em-text { font-size:.88rem; font-weight:600; }
    .loading { color:var(--muted); font-size:.88rem; padding:24px; text-align:center; font-weight:600; }

    /* Toast */
    #toast {
      position:fixed; bottom:24px; right:24px;
      background:var(--white); border:2px solid var(--border); border-radius:var(--radius);
      padding:12px 20px; font-size:.85rem; font-weight:800;
      opacity:0; transform:translateY(10px); transition:all .3s;
      z-index:2000; pointer-events:none; box-shadow:var(--shadow-md);
    }
    #toast.show { opacity:1; transform:translateY(0); }
    #toast.success { border-color:var(--green); color:var(--green); }
    #toast.error   { border-color:var(--red);   color:var(--red); }

    .nota-alta  { color:var(--green); font-weight:900; }
    .nota-media { color:var(--yellow-dk); font-weight:900; }
    .nota-baixa { color:var(--red); font-weight:900; }

    @media(max-width:700px){ .detalhe-grid{grid-template-columns:1fr;} .stats-row{grid-template-columns:1fr;} }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="logo">Sparkly<span class="dot">.</span></div>
  <div class="d-flex align-center gap-2">
    <div class="d-flex align-center gap-1"
      style="background:var(--green-soft);border:2px solid var(--green);border-radius:var(--radius-sm);padding:6px 12px;">
      <div id="professorAvatar"
        style="width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.82rem;">P</div>
      <span id="professorNome" style="font-size:.82rem;font-weight:800;color:var(--green);">Professor</span>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="sair()">Sair</button>
  </div>
</nav>

<div class="container">
  <nav class="sidebar">
    <div class="nav-label" style="margin-bottom:10px;">Menu</div>
    <button class="nav-item active" onclick="showSection('turmas')" id="nav-turmas">
      <span class="icon">📚</span> Turmas
    </button>
    <button class="nav-item" onclick="showSection('questoes')" id="nav-questoes">
      <span class="icon">❓</span> Questões
    </button>
  </nav>

  <main>

    <!-- TURMAS -->
    <div class="section active" id="sec-turmas">
      <div class="mb-3">
        <div class="page-title">Minhas Turmas 📚</div>
        <div class="page-sub">Turmas vinculadas à sua conta</div>
      </div>

      <div class="stats-row" id="statsRow">
        <div class="stat-card c1"><div class="stat-icon">📚</div><div class="stat-value" id="stat-turmas">—</div><div class="stat-label">Turmas</div></div>
        <div class="stat-card c2"><div class="stat-icon"></div><div class="stat-value" id="stat-licoes">—</div><div class="stat-label">Lições</div></div>
        <div class="stat-card c3"><div class="stat-icon">👥</div><div class="stat-value" id="stat-alunos">—</div><div class="stat-label">Alunos</div></div>
      </div>

      <div class="turmas-grid" id="turmasGrid">
        <div class="loading"><div class="spinner" style="margin:0 auto 10px;"></div>Carregando turmas...</div>
      </div>
      <div id="turmaDetalhe" style="display:none;"></div>
    </div>

    <!-- QUESTÕES -->
    <div class="section" id="sec-questoes">
      <div class="questoes-toolbar">
        <div>
          <div class="page-title">Banco de Questões </div>
          <div class="page-sub">Gerencie as questões do sistema</div>
        </div>
        <div class="d-flex gap-1">
          <button class="btn btn-outline btn-sm" onclick="sincronizarInstancias()" title="Tornar questões visíveis para alunos"> Levar aos alunos! </button>
          <button class="btn btn-primary btn-sm" onclick="abrirModalNovaQuestao()">+ Nova Questão</button>
        </div>
      </div>
      <div class="questoes-list" id="questoesList">
        <div class="loading"><div class="spinner" style="margin:0 auto 10px;"></div>Carregando questões...</div>
      </div>
    </div>

  </main>
</div>

<!-- MODAL: NOVA QUESTÃO -->
<div class="modal-overlay" id="modalQuestao">
  <div class="modal">
    <div class="modal-title">Nova Questão </div>
    <div class="form-group">
      <label class="form-label">Nome / Título</label>
      <input type="text" class="form-input" id="q-nome" placeholder="Ex: Lei de Newton — Força e Massa">
    </div>
    <div class="form-group">
      <label class="form-label">Tipo</label>
      <select class="form-select" id="q-tipo" onchange="tipoChanged()">
        <option value="multipla-escolha">Múltipla Escolha</option>
        <option value="multi-selecao">Múltipla Seleção</option>
        <option value="entrada-texto">Dissertativa / Texto</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Enunciado</label>
      <textarea class="form-textarea" id="q-enunciado" placeholder="Digite o enunciado..."></textarea>
    </div>
    <div id="bloco-alternativas" class="form-group">
      <label class="form-label">Alternativas <span id="hint-gabarito" style="color:var(--green);font-size:.65rem;"> — marque a correta</span></label>
      <div class="alternativas-container" id="alternativas-container"></div>
      <button class="btn-add-alt" onclick="adicionarAlternativa()">+ Adicionar alternativa</button>
    </div>
    <div id="bloco-gabarito" class="form-group" style="display:none;">
      <label class="form-label">Resposta esperada</label>
      <textarea class="form-textarea" id="q-gabarito" placeholder="Digite a resposta..." style="min-height:70px;"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarQuestao()"> Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: VER QUESTÃO -->
<div class="modal-overlay" id="modalVerQuestao">
  <div class="modal">
    <div class="modal-title" id="verQ-nome"></div>
    <div style="font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:14px;font-weight:800;" id="verQ-tipo"></div>
    <div class="conteudo-preview" id="verQ-conteudo"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharVerQuestao()">Fechar</button>
    </div>
  </div>
</div>

<!-- MODAL: EDITAR QUESTÃO -->
<div class="modal-overlay" id="modalEditarQuestao">
  <div class="modal">
    <div class="modal-title">Editar Questão </div>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label class="form-label">Nome / Título</label>
      <input type="text" class="form-input" id="edit-nome">
    </div>
    <div class="form-group">
      <label class="form-label">Tipo</label>
      <select class="form-select" id="edit-tipo" onchange="editTipoChanged()">
        <option value="multipla-escolha">Múltipla Escolha</option>
        <option value="multi-selecao">Múltipla Seleção</option>
        <option value="entrada-texto">Dissertativa / Texto</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Enunciado</label>
      <textarea class="form-textarea" id="edit-enunciado"></textarea>
    </div>
    <div id="edit-bloco-alternativas" class="form-group">
      <label class="form-label">Alternativas <span style="color:var(--green);font-size:.65rem;"> — marque a correta</span></label>
      <div class="alternativas-container" id="edit-alternativas-container"></div>
      <button class="btn-add-alt" onclick="editAdicionarAlternativa()">+ Adicionar alternativa</button>
    </div>
    <div id="edit-bloco-gabarito" class="form-group" style="display:none;">
      <label class="form-label">Resposta esperada</label>
      <textarea class="form-textarea" id="edit-gabarito" style="min-height:70px;"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharEditarQuestao()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarEdicao()"> Salvar Alterações</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const LETRAS = ['A','B','C','D','E','F','G','H'];
  let questoesCache = [];

  const profSS = JSON.parse(sessionStorage.getItem('professor')||'null');
  if (!profSS) {
    fetch('/api/professor/turmas').then(r=>{if(r.status===401)window.location.href='/login';}).catch(()=>window.location.href='/login');
  } else {
    const nome = profSS.nome||profSS.nome_completo||'Professor';
    document.getElementById('professorNome').textContent = nome;
    document.getElementById('professorAvatar').textContent = nome.charAt(0).toUpperCase();
  }

  function showSection(id) {
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    document.getElementById('sec-'+id).classList.add('active');
    document.getElementById('nav-'+id).classList.add('active');
    if(id==='turmas')  carregarTurmas();
    if(id==='questoes') carregarQuestoes();
  }

  function toast(msg, tipo='success') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'show '+tipo;
    setTimeout(()=>{t.className='';},3500);
  }

  async function carregarTurmas() {
    const grid = document.getElementById('turmasGrid');
    grid.innerHTML = '<div class="loading"><div class="spinner" style="margin:0 auto 10px;"></div>Carregando...</div>';
    try {
      const r = await fetch('/api/professor/turmas');
      if(r.status===401){window.location.href='/login';return;}
      const data = await r.json();
      if(!data.sucesso) throw new Error(data.erro);
      renderTurmas(data.turmas);
    } catch(e) {
      grid.innerHTML=`<div class="empty-state"><div class="em-icon"></div><div class="em-text">Erro: ${e.message}</div></div>`;
    }
  }

  function renderTurmas(turmas) {
    const grid = document.getElementById('turmasGrid');
    document.getElementById('stat-turmas').textContent = turmas.length;
    document.getElementById('stat-licoes').textContent = turmas.reduce((s,t)=>s+t.total_licoes,0);
    document.getElementById('stat-alunos').textContent = turmas.reduce((s,t)=>s+t.total_alunos,0);
    if(!turmas.length){
      grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="em-icon">📭</div><div class="em-text">Nenhuma turma encontrada.</div></div>`;
      return;
    }
    grid.innerHTML = turmas.map(t=>`
      <div class="turma-card" onclick="verTurma(${t.id})">
        <div class="t-header">
          <div class="t-nome">${t.nome}</div>
          <div class="t-sala">Sala ${t.numero_sala||'—'}</div>
        </div>
        <div class="t-stats">
          <div class="t-stat"><div class="ts-num">${t.total_licoes}</div><div class="ts-label">Lições</div></div>
          <div class="t-stat"><div class="ts-num">${t.total_alunos}</div><div class="ts-label">Alunos</div></div>
        </div>
        <button class="btn btn-outline btn-sm btn-full mt-2">Ver turma →</button>
      </div>`).join('');
  }

  async function verTurma(id) {
    document.getElementById('turmasGrid').style.display='none';
    document.getElementById('statsRow').style.display='none';
    document.querySelectorAll('#sec-turmas .page-title, #sec-turmas .page-sub').forEach(el=>el.style.display='none');
    const det = document.getElementById('turmaDetalhe');
    det.innerHTML='<div class="loading"><div class="spinner" style="margin:0 auto 10px;"></div>Carregando detalhes...</div>';
    det.style.display='block';
    try {
      const r = await fetch(`/api/professor/turmas/${id}`);
      const data = await r.json();
      if(!data.sucesso) throw new Error(data.erro);
      renderDetalhe(data);
    } catch(e) {
      det.innerHTML=`<button class="back-btn" onclick="fecharDetalhe()">← Voltar</button>
        <div class="empty-state"><div class="em-icon"></div><div class="em-text">${e.message}</div></div>`;
    }
  }

  function renderDetalhe(data) {
    const det = document.getElementById('turmaDetalhe');
    const {turma,licoes,alunos} = data;
    const badgeClass = tipo => ({'aula':'badge-blue','exercicio':'badge-yellow','prova':'badge-red'}[(tipo||'').toLowerCase()]||'badge-neutral');
    const notaClass  = v => v>=7?'nota-alta':v>=5?'nota-media':'nota-baixa';
    det.innerHTML = `
      <button class="back-btn" onclick="fecharDetalhe()">← Voltar às turmas</button>
      <div class="page-title mb-1">${turma.nome}</div>
      <div class="page-sub mb-3">Sala ${turma.numero_sala||'—'} · ID ${turma.id}</div>
      <div class="detalhe-grid">
        <div class="panel">
          <div class="panel-title"><span> Lições</span><span class="badge badge-blue">${licoes.length}</span></div>
          ${licoes.length===0
            ? '<div class="empty-state" style="padding:20px"><div class="em-icon"></div><div class="em-text">Nenhuma lição cadastrada</div></div>'
            : `<table class="table">
                <thead><tr><th>Tipo</th><th>Descrição</th><th>Nota</th></tr></thead>
                <tbody>${licoes.map(l=>`
                  <tr>
                    <td><span class="badge ${badgeClass(l.tipo)}">${l.tipo}</span></td>
                    <td>${l.descricao||'—'}</td>
                    <td style="color:var(--yellow-dk);font-weight:800;">${l.nota!=null?l.nota:'—'}</td>
                  </tr>`).join('')}
                </tbody></table>`}
        </div>
        <div class="panel">
          <div class="panel-title"><span>👥 Alunos</span><span class="badge badge-green">${alunos.length}</span></div>
          ${alunos.length===0
            ? '<div class="empty-state" style="padding:20px"><div class="em-icon">👥</div><div class="em-text">Nenhum aluno nesta turma</div></div>'
            : `<table class="table">
                <thead><tr><th>Nome</th><th>Usuário</th><th>Média</th></tr></thead>
                <tbody>${alunos.map(a=>`
                  <tr>
                    <td>${a.nome}</td>
                    <td class="text-muted">@${a.usuario}</td>
                    <td class="${notaClass(a.media)}">${a.media}</td>
                  </tr>`).join('')}
                </tbody></table>`}
        </div>
      </div>`;
  }

  function fecharDetalhe() {
    document.getElementById('turmaDetalhe').style.display='none';
    document.getElementById('turmasGrid').style.display='grid';
    document.getElementById('statsRow').style.display='grid';
    document.querySelectorAll('#sec-turmas .page-title, #sec-turmas .page-sub').forEach(el=>el.style.display='');
    carregarTurmas();
  }

  async function carregarQuestoes() {
    const list = document.getElementById('questoesList');
    list.innerHTML='<div class="loading"><div class="spinner" style="margin:0 auto 10px;"></div>Carregando...</div>';
    try {
      const r = await fetch('/api/professor/questoes');
      if(r.status===401){window.location.href='/login';return;}
      const data = await r.json();
      if(!data.sucesso) throw new Error(data.erro);
      questoesCache = data.questoes;
      renderQuestoes(data.questoes);
    } catch(e) {
      list.innerHTML=`<div class="empty-state"><div class="em-icon"></div><div class="em-text">${e.message}</div></div>`;
    }
  }

  const TIPO_LABEL = {'multipla-escolha':'Múltipla Escolha','multi-selecao':'Múltipla Seleção','entrada-texto':'Dissertativa'};

  function renderQuestoes(questoes) {
    const list = document.getElementById('questoesList');
    if(!questoes.length){
      list.innerHTML=`<div class="empty-state"><div class="em-icon"></div><div class="em-text">Nenhuma questão. Crie a primeira!</div></div>`;
      return;
    }
    list.innerHTML = questoes.map(q=>`
      <div class="questao-item">
        <div class="questao-info">
          <div class="q-nome">${q.nome}</div>
          <div class="q-tipo">${TIPO_LABEL[q.tipo]||q.tipo}</div>
        </div>
        <div class="questao-actions">
          <button class="btn-icon info" onclick="verQuestao(${q.id})" title="Ver">👁</button>
          <button class="btn-icon edit" onclick="editarQuestao(${q.id})" title="Editar">✏️</button>
          <button class="btn-icon danger" onclick="deletarQuestao(${q.id},'${q.nome.replace(/'/g,"\\'")}')">🗑</button>
        </div>
      </div>`).join('');
  }

  function verQuestao(id) {
    const q = questoesCache.find(x=>x.id===id); if(!q) return;
    document.getElementById('verQ-nome').textContent = q.nome;
    document.getElementById('verQ-tipo').textContent = TIPO_LABEL[q.tipo]||q.tipo;
    const c = q.conteudo||{};
    let html = `<div style="font-weight:700;margin-bottom:10px;">${c.enunciado||c.texto_base||'—'}</div>`;
    if(c.alternativas?.length) {
      html += c.alternativas.map((alt,i)=>
        `<div class="alt ${i===c.gabarito?'correta':''}">${LETRAS[i]}) ${alt} ${i===c.gabarito?'✓':''}</div>`).join('');
    } else if(c.gabarito!==undefined&&c.gabarito!==null&&c.gabarito!=='') {
      html+=`<div style="margin-top:10px;font-weight:700;">Gabarito: ${c.gabarito}</div>`;
    }
    document.getElementById('verQ-conteudo').innerHTML = html;
    document.getElementById('modalVerQuestao').classList.add('active');
  }
  function fecharVerQuestao() { document.getElementById('modalVerQuestao').classList.remove('active'); }

  async function deletarQuestao(id, nome) {
    if(!confirm(`Excluir "${nome}"?`)) return;
    try {
      const r = await fetch(`/api/professor/questoes/${id}`,{method:'DELETE'});
      const data = await r.json();
      if(!data.sucesso) throw new Error(data.erro);
      toast('Questão excluída! ✓'); carregarQuestoes();
    } catch(e) { toast('Erro: '+e.message,'error'); }
  }

  function abrirModalNovaQuestao() {
    document.getElementById('q-nome').value='';
    document.getElementById('q-enunciado').value='';
    document.getElementById('q-gabarito').value='';
    document.getElementById('q-tipo').value='multipla-escolha';
    resetAlternativas(); tipoChanged();
    document.getElementById('modalQuestao').classList.add('active');
  }
  function fecharModal() { document.getElementById('modalQuestao').classList.remove('active'); }

  function tipoChanged() {
    const tipo = document.getElementById('q-tipo').value;
    document.getElementById('bloco-alternativas').style.display = tipo==='entrada-texto'?'none':'block';
    document.getElementById('bloco-gabarito').style.display    = tipo==='entrada-texto'?'block':'none';
    if(tipo!=='entrada-texto') resetAlternativas();
  }

  function resetAlternativas() {
    const c = document.getElementById('alternativas-container');
    c.innerHTML = ['A','B','C','D'].map((l,i)=>`
      <div class="alternativa-row">
        <input type="radio" name="gabarito" value="${i}">
        <label>${l}</label>
        <input type="text" placeholder="Texto da alternativa ${l}">
      </div>`).join('');
  }

  function adicionarAlternativa() {
    const c = document.getElementById('alternativas-container');
    const idx = c.children.length; if(idx>=8){toast('Máximo 8 alternativas','error');return;}
    const l = LETRAS[idx];
    const div = document.createElement('div'); div.className='alternativa-row';
    div.innerHTML=`<input type="radio" name="gabarito" value="${idx}"> <label>${l}</label><input type="text" placeholder="Alternativa ${l}">`;
    c.appendChild(div);
  }

  async function salvarQuestao() {
    const nome = document.getElementById('q-nome').value.trim();
    const tipo = document.getElementById('q-tipo').value;
    const enunciado = document.getElementById('q-enunciado').value.trim();
    if(!nome){toast('Informe o nome','error');return;}
    if(!enunciado){toast('Informe o enunciado','error');return;}
    let conteudo = {enunciado};
    if(tipo!=='entrada-texto') {
      const rows = document.querySelectorAll('#alternativas-container .alternativa-row');
      const alternativas=[]; let gabarito=null;
      rows.forEach((row,i)=>{
        const radio=row.querySelector('input[type=radio]');
        const txt=row.querySelector('input[type=text]').value.trim();
        alternativas.push(txt||`Alternativa ${LETRAS[i]}`);
        if(radio?.checked) gabarito=i;
      });
      if(gabarito===null){toast('Marque a alternativa correta','error');return;}
      conteudo.alternativas=alternativas; conteudo.gabarito=gabarito;
    } else {
      conteudo.gabarito=document.getElementById('q-gabarito').value.trim();
    }
    try {
      const r = await fetch('/api/professor/questoes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,tipo,conteudo})});
      const data = await r.json();
      if(!data.sucesso) throw new Error(data.erro||JSON.stringify(data));
      toast('Questão criada! ✓'); fecharModal(); carregarQuestoes();
    } catch(e) { toast('Erro: '+e.message,'error'); }
  }

  async function sincronizarInstancias() {
    try {
      const r = await fetch('/api/professor/sincronizar-instancias',{method:'POST'});
      const data = await r.json();
      if(!data.sucesso) throw new Error(data.erro);
      toast(data.instancias_criadas===0 ? 'Tudo já sincronizado ✓' : `${data.instancias_criadas} questão(ões) sincronizadas! ✓`);
    } catch(e) { toast('Erro: '+e.message,'error'); }
  }

  function editarQuestao(id) {
    const q = questoesCache.find(x=>x.id===id); if(!q) return;
    document.getElementById('edit-id').value=q.id;
    document.getElementById('edit-nome').value=q.nome;
    document.getElementById('edit-enunciado').value=q.conteudo?.enunciado||q.conteudo?.texto_base||'';
    document.getElementById('edit-tipo').value=q.tipo;
    editTipoChanged();
    const c = q.conteudo||{};
    if(q.tipo!=='entrada-texto') {
      const alts=c.alternativas||[];
      const container=document.getElementById('edit-alternativas-container');
      container.innerHTML='';
      const lista=alts.length?alts:['','','',''];
      lista.forEach((texto,i)=>{
        const div=document.createElement('div'); div.className='alternativa-row';
        div.innerHTML=`<input type="radio" name="edit-gabarito" value="${i}" ${i===c.gabarito?'checked':''}> <label>${LETRAS[i]}</label><input type="text" value="${texto}" placeholder="Alternativa ${LETRAS[i]}">`;
        container.appendChild(div);
      });
    } else {
      document.getElementById('edit-gabarito').value=c.gabarito||'';
    }
    document.getElementById('modalEditarQuestao').classList.add('active');
  }
  function fecharEditarQuestao() { document.getElementById('modalEditarQuestao').classList.remove('active'); }
  function editTipoChanged() {
    const tipo=document.getElementById('edit-tipo').value;
    document.getElementById('edit-bloco-alternativas').style.display=tipo==='entrada-texto'?'none':'block';
    document.getElementById('edit-bloco-gabarito').style.display=tipo==='entrada-texto'?'block':'none';
  }
  function editAdicionarAlternativa() {
    const c=document.getElementById('edit-alternativas-container');
    const idx=c.children.length; if(idx>=8){toast('Máximo 8','error');return;}
    const div=document.createElement('div'); div.className='alternativa-row';
    div.innerHTML=`<input type="radio" name="edit-gabarito" value="${idx}"> <label>${LETRAS[idx]}</label><input type="text" placeholder="${LETRAS[idx]}">`;
    c.appendChild(div);
  }
  async function salvarEdicao() {
    const id=parseInt(document.getElementById('edit-id').value);
    const nome=document.getElementById('edit-nome').value.trim();
    const tipo=document.getElementById('edit-tipo').value;
    const enunciado=document.getElementById('edit-enunciado').value.trim();
    if(!nome){toast('Informe o nome','error');return;}
    if(!enunciado){toast('Informe o enunciado','error');return;}
    let conteudo={enunciado};
    if(tipo!=='entrada-texto') {
      const rows=document.querySelectorAll('#edit-alternativas-container .alternativa-row');
      const alternativas=[]; let gabarito=null;
      rows.forEach((row,i)=>{
        const radio=row.querySelector('input[type=radio]');
        const txt=row.querySelector('input[type=text]').value.trim();
        alternativas.push(txt||`Alternativa ${LETRAS[i]}`);
        if(radio.checked) gabarito=i;
      });
      if(gabarito===null){toast('Marque a alternativa correta','error');return;}
      conteudo.alternativas=alternativas; conteudo.gabarito=gabarito;
    } else {
      conteudo.gabarito=document.getElementById('edit-gabarito').value.trim();
    }
    try {
      const r=await fetch(`/api/professor/questoes/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,tipo,conteudo})});
      const data=await r.json();
      if(!data.sucesso) throw new Error(data.erro||JSON.stringify(data));
      toast('Questão atualizada! ✓'); fecharEditarQuestao(); carregarQuestoes();
    } catch(e){ toast('Erro: '+e.message,'error'); }
  }

  async function sair() {
    await fetch('/api/professor/logout',{method:'POST'}).catch(()=>{});
    sessionStorage.removeItem('professor'); sessionStorage.removeItem('professor_id');
    window.location.href='/login';
  }

  carregarTurmas();
</script>
</body>
</html>
