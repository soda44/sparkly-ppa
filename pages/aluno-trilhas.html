<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Trilhas</title>
</head>
<body>
  <h1>Trilhas</h1>
  <a href="aluno-dashboard.html">← Voltar ao Dashboard</a>

  <h2>Módulos</h2>
  <div id="lista-modulos"></div>

  <script src="../js/data/mock.js"></script>
  <script>
    if (!sessionStorage.getItem('aluno')) window.location.href = 'login.html';

    const lista = document.getElementById('lista-modulos');

    MODULOS.forEach(modulo => {
      const div = document.createElement('div');

      if (modulo.desbloqueado) {
        div.innerHTML = `
          <h3>${modulo.titulo}</h3>
          <p>Progresso: ${modulo.progresso}%</p>
          <a href="aluno-desafio.html?modulo=${modulo.id}">Iniciar</a>
          <hr>
        `;
      } else {
        div.innerHTML = `
          <h3>${modulo.titulo} [BLOQUEADO]</h3>
          <p>Complete o módulo anterior para desbloquear.</p>
          <hr>
        `;
      }

      lista.appendChild(div);
    });
  </script>
</body>
</html>
