<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard do Aluno</title>
</head>
<body>
  <h1>FísicaPlay</h1>

  <p>Olá, <strong id="nome"></strong>!</p>

  <h2>Seu progresso</h2>
  <p>Nível: <span id="nivel"></span></p>
  <p>XP: <span id="xp"></span> / <span id="xpMax"></span></p>
  <p>Acertos: <span id="acertos"></span> | Erros: <span id="erros"></span></p>

  <br>
  <a href="aluno-trilhas.html">Ver Trilhas</a>
  &nbsp;|&nbsp;
  <a href="aluno-perfil.html">Meu Perfil</a>
  &nbsp;|&nbsp;
  <a href="#" onclick="sair()">Sair</a>

  <script src="../js/data/mock.js"></script>
  <script>
    const dados = JSON.parse(sessionStorage.getItem('aluno'));
    if (!dados) window.location.href = 'login.html';

    // Verifica se voltou de um desafio com XP ganho
    const params = new URLSearchParams(window.location.search);
    if (params.get('xp_ganho')) {
      dados.xp += parseInt(params.get('xp_ganho'));
      sessionStorage.setItem('aluno', JSON.stringify(dados));
      // Limpa o parâmetro da URL sem recarregar
      history.replaceState(null, '', 'aluno-dashboard.html');
    }

    document.getElementById('nome').textContent    = dados.nome;
    document.getElementById('nivel').textContent   = dados.nivel;
    document.getElementById('xp').textContent      = dados.xp;
    document.getElementById('xpMax').textContent   = dados.xpProximoNivel;
    document.getElementById('acertos').textContent = dados.acertos;
    document.getElementById('erros').textContent   = dados.erros;

    function sair() {
      sessionStorage.removeItem('aluno');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
