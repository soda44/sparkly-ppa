<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Desafio</title>
</head>
<body>
  <h1>Desafio</h1>
  <a href="aluno-trilhas.html">← Voltar às Trilhas</a>

  <div id="tela-questao">
    <p id="progresso-questao"></p>
    <h2 id="enunciado"></h2>
    <div id="alternativas"></div>
    <p id="feedback" style="display:none;"></p>
    <button id="btn-proxima" style="display:none;" onclick="proximaQuestao()">Próxima</button>
  </div>

  <div id="tela-fim" style="display:none;">
    <h2>Desafio concluído!</h2>
    <p>Acertos: <span id="fim-acertos"></span></p>
    <p>Erros: <span id="fim-erros"></span></p>
    <p>XP ganho: <span id="fim-xp"></span></p>
    <a id="link-dashboard" href="#">Voltar ao Dashboard</a>
  </div>

  <script src="../js/data/mock.js"></script>
  <script>
    if (!sessionStorage.getItem('aluno')) window.location.href = 'login.html';

    // Lê qual módulo foi escolhido
    const params   = new URLSearchParams(window.location.search);
    const moduloId = parseInt(params.get('modulo'));

    if (!moduloId || !QUESTOES[moduloId]) {
      alert('Módulo inválido.');
      window.location.href = 'aluno-trilhas.html';
    }

    const questoes = QUESTOES[moduloId];
    let indice     = 0;
    let acertos    = 0;
    let erros      = 0;
    let respondeu  = false;

    function renderQuestao() {
      const q = questoes[indice];
      respondeu = false;

      document.getElementById('progresso-questao').textContent =
        `Questão ${indice + 1} de ${questoes.length}`;

      document.getElementById('enunciado').textContent = q.enunciado;

      const divAlt = document.getElementById('alternativas');
      divAlt.innerHTML = '';

      q.alternativas.forEach((alt, i) => {
        const btn = document.createElement('button');
        btn.textContent = alt;
        btn.onclick = () => responder(i, q.correta);
        divAlt.appendChild(btn);
        divAlt.appendChild(document.createElement('br'));
      });

      document.getElementById('feedback').style.display    = 'none';
      document.getElementById('btn-proxima').style.display = 'none';
    }

    function responder(escolha, correta) {
      if (respondeu) return;
      respondeu = true;

      const feedback = document.getElementById('feedback');
      const botoes   = document.getElementById('alternativas').querySelectorAll('button');

      // Desabilita todos os botões
      botoes.forEach(b => b.disabled = true);

      if (escolha === correta) {
        acertos++;
        feedback.textContent        = '✓ Correto!';
        feedback.style.color        = 'green';
        botoes[escolha].style.color = 'green';
      } else {
        erros++;
        feedback.textContent        = '✗ Errado. A resposta correta era: ' + questoes[indice].alternativas[correta];
        feedback.style.color        = 'red';
        botoes[escolha].style.color = 'red';
        botoes[correta].style.color = 'green';
      }

      feedback.style.display = 'block';

      // Última questão: botão vira "Finalizar"
      const btnProxima = document.getElementById('btn-proxima');
      btnProxima.textContent   = indice + 1 < questoes.length ? 'Próxima' : 'Finalizar';
      btnProxima.style.display = 'inline';
    }

    function proximaQuestao() {
      indice++;
      if (indice < questoes.length) {
        renderQuestao();
      } else {
        mostrarFim();
      }
    }

    function mostrarFim() {
      const xpGanho = acertos * 50;

      document.getElementById('tela-questao').style.display = 'none';
      document.getElementById('tela-fim').style.display     = 'block';
      document.getElementById('fim-acertos').textContent    = acertos;
      document.getElementById('fim-erros').textContent      = erros;
      document.getElementById('fim-xp').textContent         = xpGanho;

      document.getElementById('link-dashboard').href =
        `aluno-dashboard.html?xp_ganho=${xpGanho}`;
    }

    // Inicia
    renderQuestao();
  </script>
</body>
</html>
